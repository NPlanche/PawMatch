<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <title>PawMatch | Quiz </title>
        <link rel="stylesheet" href="../styles.css">
    </head>
    <body>
        <header>
            <div class="header-inner">
                <nav>
                    <a href="../index.html" class="site-logo">PawMatch</a>
                </nav>
            </div>
        </header>
        <main>
            <section>
                <h2>Dog Match Quiz</h2>
                <p>Answer these questions to find what dog breed fits your lifestyle.</p>
                <form id="quiz-form">
                    <!-- home -->
                    <fieldset>
                        <legend>
                            1. What kind of home do you live in?
                        </legend>
                        <label>
                            <input type="radio" name="home" value="apartment">
                            apartment 
                        </label>
                        <label>
                            <input type="radio" name="home" value="house">
                            House with a small yard
                        </label>
                        <label>
                            <input type="radio" name="home" value="large-property">
                             House with a large yard
                        </label>
                    </fieldset>
                    <!-- size -->
                    <fieldset>
                    <legend>3. What dog size do you want?</legend>

                    <label>
                        <input type="radio" name="size" value="small">
                        Small
                    </label>

                    <label>
                        <input type="radio" name="size" value="medium">
                        Medium
                    </label>

                    <label>
                        <input type="radio" name="size" value="large">
                        Large
                    </label>
                    </fieldset>
                    <!-- active -->
                    <fieldset>
                        <legend>2. How active do you want your dog to be?</legend>

                        <label>
                            <input type="radio" name="activity" value="low">
                            Low
                        </label>

                        <label>
                            <input type="radio" name="activity" value="medium">
                            Medium
                        </label>

                        <label>
                            <input type="radio" name="activity" value="high">
                            High
                        </label>
                    </fieldset>
                    <!-- temperament  -->
                    <fieldset>
                    <legend>4. What kind of personality do you want most?</legend>

                    <label>
                        <input type="radio" name="temperament" value="calm">
                        Calm
                    </label>

                    <label>
                        <input type="radio" name="temperament" value="playful">
                        Playful
                    </label>

                    <label>
                        <input type="radio" name="temperament" value="loyal">
                        Loyal
                    </label>
                    <label>
                        <input type="radio" name="temperament" value="friendly">
                        Friendly    
                    </label>
                    <label>
                        <input type="radio" name="temperament" value="protective">
                        Protective
                    </label>
                    <label>
                        <input type="radio" name="temperament" value="independent">
                        Independent
                    </label>
                    </fieldset>

                    <button type="submit">See Results</button>
                </form>
            </section>
        </main>
        <script type="module" src="../js/dog/dog-quiz.js"></script>
    </body>
</html>
